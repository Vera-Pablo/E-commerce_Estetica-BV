<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Estilos y Toasts</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/box-shadow.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Base CSS -->
    <link href="assets/css/base.css" rel="stylesheet">
</head>
<body class="p-5">
    <div class="container text-center">
        <h1 class="mb-4">Prueba de Estilos Base y Toast Helper</h1>
        
        <!-- Botones de Prueba de Estilos -->
        <div class="my-5 p-4 border rounded bg-white shadow-sm">
            <h2 class="h5 mb-3 text-muted">Botones Personalizados</h2>
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <button class="btn btn-custom-nav">Botón Navegación (.btn-custom-nav)</button>
                <button class="btn btn-custom-back">Botón Volver (.btn-custom-back)</button>
            </div>
        </div>

        <!-- Botones de Disparador Manual de Toasts -->
        <div class="my-5 p-4 border rounded bg-white shadow-sm">
            <h2 class="h5 mb-3 text-muted">Disparadores Manuales de Toasts</h2>
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <button class="btn btn-success" onclick="ToastHelper.show('success', '¡Operación realizada con éxito!')">Lanzar Éxito</button>
                <button class="btn btn-danger" onclick="ToastHelper.show('error', 'Ha ocurrido un error al procesar la solicitud.')">Lanzar Error</button>
                <button class="btn btn-warning text-dark" onclick="ToastHelper.show('warning', 'Atención: El stock de este producto es bajo.')">Lanzar Advertencia</button>
            </div>
        </div>

        <div class="alert alert-info" role="alert">
            Este archivo también incluye elementos de sesión flash ocultos (ej. <code>#flash-success</code>) que disparan un toast de bienvenida automáticamente al cargar la página.
        </div>
    </div>

    <!-- Inputs Ocultos que simulan Flash Messages de CodeIgniter 4 -->
    <input type="hidden" id="flash-success" value="¡Bienvenido de vuelta! Los estilos y notificaciones se han cargado correctamente.">

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Toast JS Helper -->
    <script src="assets/js/toast.js"></script>
</body>
</html>
